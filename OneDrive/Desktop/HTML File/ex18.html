<!DOCTYPE html> 

<html> 

<head> 

  <title>Pseudo Elements </title> 

  <style> 

    body{ 

      font-family: Arial; 

      padding: 20px; 

    } 

    h2::before{ 

      content: "→ "; 

      color: blue; 

    } 

 

    /* simple button */ 

    .btn{ 

      background: #3498db; 

      color: white; 

      padding: 10px 15px; 

      border: none; 

      cursor: pointer; 

      position: relative; 

    } 

 

    /* underline using ::after */ 

    .btn::after{ 

      content: ""; 

      position: absolute; 

      left: 0; 

      bottom: -4px; 

      width: 100%; 

      height: 3px; 

      background: #1f6ca1; 

      display: none; 

    } 

 

    .btn:hover::after{ 

      display: block; 

    } 

 

    /* box with label */ 

    .box{ 

      width: 150px; 

      height: 80px; 

      background: #ddd; 

      padding: 10px; 

      margin-top: 20px; 

      position: relative; 

    } 

 

    .box::before{ 

      content: "Label"; 

      position: absolute; 

      top: -12px; 

      left: 10px; 

      background: #333; 

      color: white; 

      padding: 2px 6px; 

      font-size: 12px; 

      border-radius: 3px; 

    } 

  </style> 

</head> 

<body> 

<h2>Pseudo Elements</h2> 

<button class="btn">Click Me</button> 

<div class="box">This is a box</div> 

</body> 

</html>
