<body>
    <h2>Contact Us</h2>
    <form action="#" method="post">
        <input type="text" name="fullName"><br>
        <input type="radio" name="inquiry_type" value="male">male
        <input type="radio" name="inquiry_type" value="female">female<br>
        <input type="checkbox" name="interests" value="html">HTML
        <input type="checkbox" name="interests" value="css">CSS
        <input type="checkbox" name="interests" value="js">JS<br>
        <select name="country">
            <option value="">--</option>
            <option value="india">IN</option>
            <option value="usa">US</option>
            <option value="uk">UK</option>
        </select><br>
        <textarea name="message" rows="3"></textarea><br>
        <input type="submit" value="Send">
    </form>
</body>
