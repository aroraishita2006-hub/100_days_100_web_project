<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Units Demonstration</title>

    <style>
        /* Root font size for rem demonstration */
        html {
            font-size: 16px;
        }

        /* Heading using px */
        h1 {
            font-size: 32px;   /* px units */
            text-align: center;
        }

        /* Paragraph using em (relative to parent font size) */
        .em-text {
            font-size: 1.5em;   /* 1.5 × parent font size */
            background-color: #e8f5e9;
            padding: 1em;       /* Padding also in em */
            margin-bottom: 20px;
        }

        /* Box using rem (relative to root html size) */
        .rem-box {
            font-size: 1.2rem;   /* 1.2 × 16px = 19.2px */
            background-color: #e3f2fd;
            padding: 1rem;       /* 16px padding */
            border: 2px solid #2196f3;
            margin-bottom: 25px;
            width: 50%;          /* % width */
        }

        /* Percentage-based box */
        .percent-box {
            background-color: #fff3e0;
            width: 70%;          /* % of parent width */
            padding: 20px;
            border: 3px dashed #fb8c00;
        }
    </style>
</head>
<body>

    <h1>CSS Units Demonstration</h1>

    <p class="em-text">
        This paragraph uses <b>em</b> units for font size and padding. It scales based on its parent's font size.
    </p>

    <div class="rem-box">
        This box uses <b>rem</b> units, which depend on the root (HTML) font size.
    </div>

    <div class="percent-box">
        This box uses <b>%</b> units for width, so it adjusts based on the size of the browser window.
    </div>

</body>
</html>
