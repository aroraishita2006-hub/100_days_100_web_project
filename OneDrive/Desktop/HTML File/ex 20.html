<!DOCTYPE html>
<html>
<head>
  <title>Button Hover Animation</title>
  <style>
    .btn {
      padding: 12px 25px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.15);
      background: #1f78c1;
    }
  </style>
</head>
<body>

  <h2>Transform Button Animation</h2>
  <button class="btn">Hover Me</button>

</body>
</html>
