<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Layout Demo</title>

    <style>
        /* Basic styling for the container */
        .container {
            max-width: 900px;      /* Layout will not stretch beyond 900px */
            min-width: 300px;      /* Layout won't shrink below 300px */
            margin: auto;
            padding: 20px;
            background: #f5f5f5;
            border: 2px solid #ccc;
        }

        /* Responsive image */
        img {
            width: 100%;         /* Image becomes responsive */
            max-width: 600px;    /* Never becomes bigger than 600px */
            display: block;
            margin: auto;
        }

        /* Text section */
        .text-box {
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 2px solid #8a8a8a;
            margin-top: 20px;
        }

        /* Media Query – for mobile screens */
        @media (max-width: 600px) {
            body {
                background-color: #d7efff;
            }

            .text-box {
                font-size: 14px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Responsive Design with min-width and max-width</h1>

        <img src="https://via.placeholder.com/600x300" alt="Demo Image">

        <div class="text-box">
            <p>
                This layout adjusts automatically based on screen size.
                Resize your browser to observe the effect of min-width, max-width, 
                and media queries.
            </p>
        </div>
    </div>

</body>
</html>
