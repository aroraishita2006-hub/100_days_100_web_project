<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model Example</title>

    <style>
        /* Box 1 */
        .box1 {
            width: 300px;
            background-color: #e3f2fd;
            border: 4px solid #2196f3;      /* Border */
            padding: 20px;                   /* Space inside the border */
            margin: 25px;                    /* Space outside the border */
        }

        /* Box 2 */
        .box2 {
            width: 300px;
            background-color: #fff3e0;
            border: 4px dashed #fb8c00;
            padding: 15px;
            margin: 20px;
        }

        /* Heading style */
        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1>CSS Box Model Demonstration</h1>

    <div class="box1">
        <h3>Box 1</h3>
        <p>This box shows how <b>padding</b> increases space inside the element, while 
        <b>margin</b> creates space outside the element.</p>
    </div>

    <div class="box2">
        <h3>Box 2</h3>
        <p>This box uses a <i>dashed border</i> and different padding & margin values to 
        visually demonstrate the CSS box model.</p>
    </div>

</body>
</html>
